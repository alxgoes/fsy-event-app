<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <!-- Rounded background matching official PWA mobile theme (#0B1528) -->
  <rect width="192" height="192" rx="44" fill="#0B1528"/>
  
  <g transform="translate(18, 48)">
    <!-- Circle 1: F (Cyan-Blue #007DA5) -->
    <!-- Solid 3D Drop Shadow -->
    <circle cx="32" cy="52" r="26" fill="#060C17"/>
    <!-- Circle Badge -->
    <circle cx="28" cy="48" r="26" fill="#007DA5" stroke="#0F172A" stroke-width="2"/>
    <!-- Letter F with Slab-Serifs -->
    <path d="M19 33 h16.5 v5 h-4.5 v5 h3.5 v4.5 h-3.5 v10 h4.5 v4.5 h-12 v-4.5 h4.5 v-20 h-4.5 z" fill="#FFFFFF"/>
    <!-- Star Sparkle on F -->
    <path d="M37 32.5 q2 2 4 2 q-2 2 -2 4 q-2 -2 -4 -2 q2 -2 2 -4 z" fill="#FFFFFF"/>

    <!-- Circle 2: S (Sunny Yellow #FFDB65) -->
    <!-- Solid 3D Drop Shadow -->
    <circle cx="80" cy="52" r="26" fill="#060C17"/>
    <!-- Circle Badge -->
    <circle cx="76" cy="48" r="26" fill="#FFDB65" stroke="#0F172A" stroke-width="2"/>
    <!-- Letter S with Serifs -->
    <path d="M84 36.5 c-1.5 -1.8 -4 -2.8 -6.8 -2.8 c-4.2 0 -6.8 2.3 -6.8 5.2 c0 3.2 2.8 4.3 6.4 5.3 c3.8 1.1 7.2 2.6 7.2 7 c0 4.6 -3.8 7.6 -9 7.6 c-3.8 0 -7 -1.3 -8.8 -3.7 l2.8 -3.7 c1.6 1.8 4 2.8 6.3 2.8 c3.8 0 5.8 -2 5.8 -4.2 c0 -3.2 -2.6 -4.2 -6.2 -5.2 c-4 -1.2 -7.4 -2.6 -7.4 -7.2 c0 -4.4 3.6 -7.4 8.5 -7.4 c3.4 0 6.2 1.1 8 3 z" fill="#0F172A"/>

    <!-- Circle 3: Y (Coral Pink #FC4E6D) -->
    <!-- Solid 3D Drop Shadow -->
    <circle cx="128" cy="52" r="26" fill="#060C17"/>
    <!-- Circle Badge -->
    <circle cx="124" cy="48" r="26" fill="#FC4E6D" stroke="#0F172A" stroke-width="2"/>
    <!-- Letter Y with Serifs -->
    <path d="M113 33 h6.5 l4.5 10 l4.5 -10 h6.5 v3.5 h-1.5 l-6.5 13 v9 h4 v4 h-11.5 v-4 h4 v-9 l-6.5 -13 h-1.5 z" fill="#FFFFFF"/>
  </g>
</svg>
