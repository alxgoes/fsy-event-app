<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Crisp Arch Container matching official FSY 2027 Artwork -->
  <path
    d="M 14 20 A 18 18 0 0 1 50 20 L 50 60 L 14 60 Z"
    fill="#EFEFE7"
    stroke="#0F172A"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Baseline -->
  <line x1="16" y1="58" x2="48" y2="58" stroke="#0F172A" stroke-width="1.6" stroke-linecap="round" />

  <!-- Outer Left Spire -->
  <path d="M 18 58 L 18 42 L 20.5 35 L 23 42 L 23 58" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" stroke-linejoin="round" />
  <line x1="20.5" y1="35" x2="20.5" y2="58" stroke="#0F172A" stroke-width="0.8" />

  <!-- Middle Left Spire -->
  <path d="M 23 58 L 23 34 L 26 27 L 29 34 L 29 58" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" stroke-linejoin="round" />
  <line x1="26" y1="27" x2="26" y2="58" stroke="#0F172A" stroke-width="0.8" />

  <!-- Inner Left Spire -->
  <path d="M 29 58 L 29 28 L 31.5 22 L 34 28 L 34 58" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Center Main Body & Walls -->
  <path d="M 23 58 L 23 44 L 41 44 L 41 58 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" />
  <path d="M 26 44 L 26 34 L 38 34 L 38 44 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" />
  <path d="M 28 34 L 28 26 L 36 26 L 36 34 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" />

  <!-- Inner Right Spire -->
  <path d="M 30 58 L 30 28 L 32.5 22 L 35 28 L 35 58" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Middle Right Spire -->
  <path d="M 35 58 L 35 34 L 38 27 L 41 34 L 41 58" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" stroke-linejoin="round" />
  <line x1="38" y1="27" x2="38" y2="58" stroke="#0F172A" stroke-width="0.8" />

  <!-- Outer Right Spire -->
  <path d="M 41 58 L 41 42 L 43.5 35 L 46 42 L 46 58" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" stroke-linejoin="round" />
  <line x1="43.5" y1="35" x2="43.5" y2="58" stroke="#0F172A" stroke-width="0.8" />

  <!-- Center Tower Spire (A-Frame) -->
  <path d="M 29 26 L 31.5 13 L 32.5 13 L 35 26 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" stroke-linejoin="round" />
  <line x1="32" y1="13" x2="32" y2="26" stroke="#0F172A" stroke-width="0.8" />

  <!-- Battlement Crenellations -->
  <path d="M 27 44 L 27 42 L 29 42 L 29 44 L 31 44 L 31 42 L 33 42 L 33 44 L 35 44 L 35 42 L 37 42 L 37 44" stroke="#0F172A" stroke-width="1" fill="none" />
  <path d="M 29 34 L 29 32.5 L 31 32.5 L 31 34 L 33 34 L 33 32.5 L 35 32.5 L 35 34" stroke="#0F172A" stroke-width="1" fill="none" />

  <!-- Central Arched Portal / Door in Radiant Gold -->
  <path
    d="M 29.5 58 L 29.5 48 C 29.5 45, 34.5 45, 34.5 48 L 34.5 58 Z"
    fill="#DBBF6B"
    stroke="#0F172A"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Angel Moroni in Radiant Gold with Trumpet pointing up-right -->
  <g transform="translate(32, 6)">
    <!-- Spire Cap / Pedestal -->
    <rect x="-1.5" y="6" width="3" height="1.5" fill="#DBBF6B" stroke="#0F172A" stroke-width="0.7" rx="0.3" />
    <!-- Figure Body -->
    <path d="M 0 6 L -0.8 2 C -0.8 1, 0.8 1, 0.8 2 L 0.5 6 Z" fill="#DBBF6B" stroke="#0F172A" stroke-width="0.6" />
    <!-- Head -->
    <circle cx="0.2" cy="1" r="1.1" fill="#DBBF6B" stroke="#0F172A" stroke-width="0.5" />
    <!-- Raised Trumpet (45-degree angle) -->
    <line x1="0.8" y1="1" x2="4.5" y2="-1.8" stroke="#DBBF6B" stroke-width="0.9" stroke-linecap="round" />
    <polygon points="4,-2.4 5.2,-1.3 4.2,-1" fill="#DBBF6B" />
  </g>
</svg>
